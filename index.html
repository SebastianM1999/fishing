<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Driftwood Cove — a cozy fishing game</title>
  <meta name="description" content="A small, cozy 2.5D fishing game. Explore, fish, collect and upgrade.">
  <meta name="theme-color" content="#3f6e8c">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <canvas id="world" aria-label="Game world"></canvas>

  <header class="hud" id="hud">
    <div class="hud-card">
      <span class="coins" title="Coins"><span class="coin-icon" aria-hidden="true"></span><span id="hud-coins">30</span></span>
      <span class="time-chip" id="hud-time-chip">
        <span class="time-icon" id="hud-time-icon" aria-hidden="true"></span>
        <span id="hud-time">Dawn</span>
        <span class="time-bar" aria-hidden="true"><span id="hud-time-bar"></span></span>
      </span>
    </div>
    <div class="hud-card hud-sub">
      <span id="hud-region">Village</span>
      <span class="dot" aria-hidden="true">·</span>
      <span>Collection <strong id="hud-collection">0 / 20</strong></span>
    </div>
  </header>

  <nav class="hud-buttons" aria-label="Menus">
    <button type="button" id="btn-bag" class="pill"><span class="key">I</span> Bag <span class="badge" id="bag-count">0</span></button>
    <button type="button" id="btn-board" class="pill"><span class="key">C</span> Collection</button>
    <button type="button" id="btn-settings" class="pill icon-only" aria-label="Settings" title="Settings"></button>
  </nav>

  <button type="button" id="action-btn" class="action-btn" hidden><span class="key" id="action-key">E</span> <span id="action-label">Fish</span></button>

  <section id="fishing" class="fishing-panel" hidden aria-live="polite">
    <div class="fishing-status" id="fishing-status"><span class="status-ico" id="fishing-status-ico"></span><span id="fishing-status-text">Casting…</span></div>
    <div id="minigame" class="minigame" hidden>
      <div class="mg-head">
        <span class="mg-behavior"><span class="mg-behavior-ico" id="mg-behavior-ico"></span><span id="mg-behavior">Fish on!</span></span>
        <span id="mg-phase" class="mg-phase" hidden></span>
      </div>
      <div class="lane" id="mg-lane">
        <div class="lane-waves" aria-hidden="true"></div>
        <div class="zone" id="mg-zone" aria-hidden="true"><span class="zone-edge left"></span><span class="zone-edge right"></span></div>
        <div class="lane-fish" id="mg-fish" aria-hidden="true"></div>
      </div>
      <div class="meters">
        <div class="meter"><span class="meter-ico" data-icon="net" title="Catch progress"></span><div class="bar progress-bar"><div class="bar-fill progress" id="mg-progress"></div></div><span class="meter-val" id="mg-progress-val">0%</span></div>
        <div class="meter"><span class="meter-ico" data-icon="line2" title="Line tension"></span><div class="bar tension-bar"><div class="bar-fill tension" id="mg-tension"></div><span class="danger-mark" aria-hidden="true"></span></div><span class="meter-val" id="mg-tension-val">0%</span></div>
      </div>
      <p class="mg-hint"><span class="hint-keys"><span class="key">Space</span><span class="hint-or">or</span><span class="mg-mouse" data-icon="mouse"></span></span> hold to reel <b>→</b> · release to ease the line</p>
    </div>
  </section>

  <section id="catch-card" class="catch-card" hidden aria-live="assertive">
    <div class="catch-art" id="catch-art"></div>
    <h2 id="catch-title">Caught!</h2>
    <p id="catch-details"></p>
    <p id="catch-note" class="catch-note"></p>
    <p id="catch-extra" class="catch-extra"></p>
    <button type="button" id="catch-ok" class="primary">Continue <span class="key">Esc</span></button>
  </section>

  <div id="joystick" class="joystick" aria-hidden="true"><div id="joystick-knob" class="knob"></div></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="fade" class="fade" aria-hidden="true"></div>

  <dialog id="shop-dialog" class="panel" aria-labelledby="shop-title">
    <header class="panel-head">
      <h2 id="shop-title">Tackle Shop</h2>
      <span class="coins"><span class="coin-icon" aria-hidden="true"></span><span id="shop-coins">0</span></span>
      <button type="button" class="close" data-close aria-label="Close">✕</button>
    </header>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-market" aria-selected="true" data-tab="market">Sell</button>
      <button type="button" role="tab" id="tab-gear" aria-selected="false" data-tab="gear">Gear</button>
    </div>
    <div id="shop-market" class="panel-body" role="tabpanel" aria-labelledby="tab-market"></div>
    <div id="shop-gear" class="panel-body" role="tabpanel" aria-labelledby="tab-gear" hidden></div>
  </dialog>

  <dialog id="bag-dialog" class="panel" aria-labelledby="bag-title">
    <header class="panel-head">
      <h2 id="bag-title">Fish bag</h2>
      <button type="button" class="close" data-close aria-label="Close">✕</button>
    </header>
    <div id="bag-body" class="panel-body"></div>
  </dialog>

  <dialog id="board-dialog" class="panel wide" aria-labelledby="board-title">
    <header class="panel-head">
      <h2 id="board-title">Collection wallboard</h2>
      <strong id="board-count">0 / 20</strong>
      <button type="button" class="close" data-close aria-label="Close">✕</button>
    </header>
    <p class="board-hint">Hover, focus or tap a fish to see your best catch.</p>
    <div id="board-body" class="panel-body board-grid"></div>
    <div id="board-tip" class="board-tip" role="tooltip" hidden></div>
  </dialog>

  <dialog id="unlock-dialog" class="panel small" aria-labelledby="unlock-title">
    <header class="panel-head">
      <h2 id="unlock-title">Construction site</h2>
      <button type="button" class="close" data-close aria-label="Close">✕</button>
    </header>
    <div class="panel-body unlock-body">
      <div id="unlock-art" class="unlock-art" aria-hidden="true"></div>
      <p id="unlock-text"></p>
      <p class="unlock-price"><span class="value"><span class="coin-icon" aria-hidden="true"></span><span id="unlock-price">0</span></span> <span id="unlock-have" class="muted"></span></p>
      <div class="unlock-actions">
        <button type="button" class="secondary" data-close>Not now</button>
        <button type="button" class="primary" id="unlock-pay">Pay the builders</button>
      </div>
    </div>
  </dialog>

  <dialog id="settings-dialog" class="panel small" aria-labelledby="settings-title">
    <header class="panel-head">
      <h2 id="settings-title">Settings</h2>
      <button type="button" class="close" data-close aria-label="Close">✕</button>
    </header>
    <form class="panel-body settings-body" method="dialog">
      <label class="setting"><span class="setting-ico" data-icon="music"></span><span>Music</span><input type="range" id="vol-music" min="0" max="100" step="1"><output for="vol-music"></output></label>
      <label class="setting"><span class="setting-ico" data-icon="speaker"></span><span>Sounds</span><input type="range" id="vol-sfx" min="0" max="100" step="1"><output for="vol-sfx"></output></label>
      <label class="setting"><span class="setting-ico" data-icon="leaf"></span><span>Nature</span><input type="range" id="vol-ambience" min="0" max="100" step="1"><output for="vol-ambience"></output></label>
      <label class="setting toggle"><span class="setting-ico" data-icon="mute"></span><span>Mute everything</span><input type="checkbox" id="vol-mute"></label>
    </form>
  </dialog>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
  </script>
</body>
</html>
